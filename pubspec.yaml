name: car_rental_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  go_router: ^17.0.0
  flutter_bloc: ^9.1.1
  uuid: ^4.5.2
  get_it: ^9.1.1
  flutter_platform_widgets: ^8.0.0
  supabase_flutter: ^2.10.3
  app_links: ^6.4.1
  intl_phone_number_input: ^0.7.5
  cupertino_native: ^0.1.1
  adaptive_platform_ui: ^0.1.100
  equatable: ^2.0.7
  shimmer: ^3.0.0
  google_maps_flutter: ^2.14.0
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  http: ^1.6.0
  fl_chart: ^1.1.1
  image_picker: ^1.2.1
  flutter_image_compress: ^2.4.0
  readmore: ^3.0.0
  smooth_page_indicator: ^2.0.1
  cached_network_image: ^3.4.1
  timeago: ^3.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4



flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/launcher_icons/main.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/launcher_icons/android.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/launcher_icons/main.png"
    background_color: "#FFFFFF"
    theme_color: "#000000"



flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/
    - assets/onboarding/
    - assets/launcher_icons/
